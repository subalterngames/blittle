[package]
name = "blittle"
version = "0.4.4"
edition = "2024"
description = "A fast little blitter"
authors = ["Esther Alter <subalterngames@gmail.com>"]
readme = "README.md"
repository = "https://github.com/subalterngames/blittle"
license-file = "LICENSE"
keywords = ["blitting", "image", "sprite", "gamedev", "graphics"]
categories = ["game-development", "graphics", "rendering"]

[dependencies]
bytemuck = { version = "1.25.0", optional = true}
glam = { version = "0.32.1", optional = true }
rayon = { version = "1.11.0", optional = true }
serde = { version = "1", features = ["derive"], optional = true}

[dev-dependencies]
blit = "0.8.5"
criterion = "0.8.2"
num-traits = "0.2.19"
png = "0.18.0"
sdl2 = "0.38.0"

[[bench]]
name = "bench"
harness = false

[features]
overlay = ["dep:bytemuck", "dep:glam"]
rayon = ["dep:rayon"]
serde = ["dep:serde", "glam/serde"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
